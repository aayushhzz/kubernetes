version: 0.2

env:
  shell: bash
  variables:
    GOTOOLCHAIN: go1.27.2+auto

phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - |
        export GOENV_VERSION="$GOLANG_24_VERSION"
        go version
  build:
    commands:
      - |
        set -euo pipefail
        export GOENV_VERSION="$GOLANG_24_VERSION"
        HEAD_SHA=$(git rev-parse HEAD)
        test "$HEAD_SHA" = "${CODEBUILD_RESOLVED_SOURCE_VERSION:?source version is missing}"
        case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
          pr/*) ;;
          *) echo 'This project requires a pull-request webhook event.' >&2; exit 2 ;;
        esac
        BASE_REF=${CODEBUILD_WEBHOOK_BASE_REF:?pull-request base ref is missing}
        test "$BASE_REF" = 'refs/heads/master'
        echo 'kubernetes baseline: no Hexagon selection; full root-module Go suite.'
        TEST_START=$(date +%s)
        set +e
        go test -count=1 ./...
        TEST_STATUS=$?
        set -e
        TEST_END=$(date +%s)
        echo "BENCH_TEST_SECONDS=$((TEST_END - TEST_START))"
        echo "BENCH_TEST_STATUS=$TEST_STATUS"
        exit "$TEST_STATUS"
